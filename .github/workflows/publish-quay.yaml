name: Publish (quay)

# Fork-side quay publish. The upstream publish.yaml targets GHCR on a
# nightly schedule with FIPS variants; this workflow pushes the EnMaaS
# deployment image to quay.io/modden/praxis-ai (interim personal
# namespace) on every push to main and mirrors the identical image index
# to the org-owned quay.io/redhat-et/praxis-ai, so deployment digest pins
# track the fork. The mirror is a registry-side skopeo copy: it preserves
# the pushed index and its attestation manifests at the same digest and
# never passes the image through the daemon image store, which would
# flatten the index to a single-platform manifest at a different digest.
# Keeping this workflow a separate file means upstream rebases never
# conflict with it. Ownership, rotation, and the release policy are
# documented in docs/enmaas-image-publishing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Optional full commit SHA reachable from the selected branch; defaults to its tip.
        required: false
        type: string

# Serialize publications per branch. GitHub Actions keeps at most one
# running and one pending run per group, and a newer run replaces the
# pending one, so when several commits land on main in quick succession
# the superseded commits' publishes are skipped: they receive no image,
# SBOM, or sha- tag until they are built by the manual dispatch path. A
# running publish is never cancelled (cancel-in-progress is false), so
# exactly one publish executes at a time and a run building an older
# commit can never move the mutable main tags backward after a newer run
# has published them; the tip check in the tags step relies on this
# serialization.
concurrency:
  group: publish-quay-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish-quay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      IMAGE: quay.io/modden/praxis-ai
      REDHAT_IMAGE: quay.io/redhat-et/praxis-ai
      # Upstream full excludes the opt-in OpenAI groups and stores.
      # Retain the deployed fork capabilities explicitly.
      PRAXIS_AI_FEATURES: full,openai-all,store-postgres,gcp-adc-filter,vertex-anthropic-filter,api-key-auth-filter
      SOURCE_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source belongs to the selected branch
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          case "${GITHUB_REF}" in
            refs/heads/*) ;;
            *) echo "::error::select a branch for candidate publication"; exit 1 ;;
          esac
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full lowercase SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${GITHUB_SHA}"; then
            echo "::error::commit must be reachable from the selected branch tip"
            exit 1
          fi
          git checkout --detach "${SOURCE_SHA}"

      - name: Check publish credentials
        # Runs before anything is built or published so a missing mirror
        # secret fails the job with no image pushed and no mutable tag
        # moved on either registry.
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_ORG_USERNAME: ${{ secrets.QUAY_ORG_USERNAME }}
          QUAY_ORG_TOKEN: ${{ secrets.QUAY_ORG_TOKEN }}
        shell: bash
        run: |
          for secret in QUAY_USERNAME QUAY_TOKEN QUAY_ORG_USERNAME QUAY_ORG_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "::error::${secret} is not set; nothing has been published"
              exit 1
            fi
          done

      - name: Install skopeo
        # Installed before the build so an apt or packaging failure cannot
        # leave the interim registry's mutable main tag ahead of the mirror.
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Quay
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ env.IMAGE }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_main=false
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # Move the mutable main tags only while this commit is still
            # the branch tip. Runs are serialized per branch (see the
            # workflow concurrency group), so no newer publisher can land
            # between this check and the pushes below.
            tip=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
            if [[ ! "${tip}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::could not resolve the current tip of main"
              exit 1
            fi
            if [ "${SOURCE_SHA}" = "${tip}" ]; then
              publish_main=true
            else
              echo "::notice::${SOURCE_SHA} is no longer the tip of main; publishing the sha tag only"
            fi
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${SOURCE_SHA}"
            if [ "${publish_main}" = true ]; then
              echo "${IMAGE}:main"
            fi
            echo "EOF"
            echo "publish_main=${publish_main}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            PRAXIS_AI_FEATURES=${{ env.PRAXIS_AI_FEATURES }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Verify SBOM files
        run: |
          test -s source.spdx.json
          test -s image.spdx.json
          jq -e '.spdxVersion' source.spdx.json >/dev/null
          jq -e '.spdxVersion' image.spdx.json >/dev/null

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: praxis-ai-sbom-${{ env.SOURCE_SHA }}
          path: |
            source.spdx.json
            image.spdx.json
          retention-days: 90

      - name: Mirror the image index to the Red Hat repository
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          QUAY_ORG_USERNAME: ${{ secrets.QUAY_ORG_USERNAME }}
          QUAY_ORG_TOKEN: ${{ secrets.QUAY_ORG_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH_MAIN: ${{ steps.tags.outputs.publish_main }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          # Registry-side copy. Preserves the pushed index and its
          # attestation manifests byte-for-byte, which a daemon
          # pull/tag/push cannot do. Separate 0600 authfiles keep the two
          # quay.io credentials apart; the tokens are read from stdin and
          # the authfiles are deleted when the step exits.
          umask 077
          auth=$(mktemp -d)
          trap 'rm -rf "$auth"' EXIT
          src="${auth}/source.json"
          dest="${auth}/destination.json"
          printf '%s' "$QUAY_TOKEN" | skopeo login --authfile "$src" \
            --username "$QUAY_USERNAME" --password-stdin quay.io
          printf '%s' "$QUAY_ORG_TOKEN" | skopeo login --authfile "$dest" \
            --username "$QUAY_ORG_USERNAME" --password-stdin quay.io
          mirror_tags=("sha-${SOURCE_SHA}")
          if [ "${PUBLISH_MAIN}" = true ]; then
            mirror_tags+=(main)
          fi
          for tag in "${mirror_tags[@]}"; do
            skopeo copy --all --preserve-digests --retry-times 5 \
              --src-authfile "$src" --dest-authfile "$dest" \
              "docker://${IMAGE}@${DIGEST}" "docker://${REDHAT_IMAGE}:${tag}"
            mirrored="sha256:$(skopeo inspect --authfile "$dest" --raw \
              "docker://${REDHAT_IMAGE}:${tag}" | sha256sum | cut -d' ' -f1)"
            if [ "${mirrored}" != "${DIGEST}" ]; then
              echo "::error::${REDHAT_IMAGE}:${tag} resolved to ${mirrored}, expected ${DIGEST}"
              exit 1
            fi
          done

      - name: Record digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISH_MAIN: ${{ steps.tags.outputs.publish_main }}
        run: |
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### Published praxis-ai image"
            echo ""
            echo "\`$IMAGE@$DIGEST\` (canonical)"
            echo "\`$REDHAT_IMAGE@$DIGEST\` (registry-side mirror, digest verified)"
            echo ""
            echo "- source commit: \`$SOURCE_SHA\`"
            echo "- ref: \`$GITHUB_REF\`"
            if [ "${PUBLISH_MAIN}" = true ]; then
              echo "- mutable \`main\` tags: published (this commit is the branch tip)"
            else
              echo "- mutable \`main\` tags: not published (sha tag only)"
            fi
            echo "- SBOM artifact: \`praxis-ai-sbom-$SOURCE_SHA\`"
            echo "- superseded publishes: a newer push replaces a pending publish run; the superseded commit is built via the manual dispatch path"
            echo "- workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of Quay
        if: always()
        run: docker logout quay.io || true
