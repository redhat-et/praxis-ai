# Intelligent Route: provider-specific target model rewrite
#
# The public model is promoted to X-Model, routed to a candidate, and then
# rewritten to the candidate's target_model before forwarding. This is useful
# when multiple providers expose different model identifiers for one public
# model name.

listeners:
  - name: proxy
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: model_to_header
        header: X-Model

      - filter: intelligent_route
        local_site: site-a
        model_header: X-Model
        candidates:
          - kind: inference_model
            name: public-model
            site: site-a
            cluster: provider-a
            target_model: provider-a/internal-model
            paths:
              - /v1/chat/completions

      - filter: load_balancer
        clusters:
          - name: provider-a
            endpoints:
              - "127.0.0.1:8001"

admin:
  address: "127.0.0.1:9901"
shutdown_timeout_secs: 5

insecure_options:
  allow_private_endpoints: true
